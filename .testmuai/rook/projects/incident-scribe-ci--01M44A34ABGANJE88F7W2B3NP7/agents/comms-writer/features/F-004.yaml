local_id: F-004
name: Use customer-facing plain language
user_story: >-
  As a customer, I provide an incident facts object through incident-scribe and want the resulting
  status note to explain the impact and next steps in plain language without internal jargon or team
  names.
expected_behaviour: >-
  Use plain, customer-understandable language and omit internal jargon and team names while
  describing the affected service, severity, and next steps.
edge_cases:
  - Internal jargon must be translated or omitted rather than repeated.
  - Team names must be omitted even when supplied in owning_team.
validation_rules:
  - Use plain language.
  - Omit internal jargon.
  - Omit team names.
  - Do not expose severity codes; express severity in plain language.
assumptions:
  - The note is intended for a general customer audience rather than internal incident responders.
sources:
  - 'incident_scribe/agent.py: COMMS_SYSTEM'
  - 'README.md: The subagent'
  - 'README.md: The rules it must follow'
calls: []
confidence: null
known_data: []
