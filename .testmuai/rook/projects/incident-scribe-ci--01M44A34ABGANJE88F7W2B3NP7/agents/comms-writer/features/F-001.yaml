local_id: F-001
name: Draft a concise customer status note from supplied facts
user_story: >-
  As incident-scribe, I provide a structured facts object containing assessment, service, tier,
  owning_team, runbook_url, and on_call, so that comms-writer returns a concise public status note
  for customers.
expected_behaviour: >-
  When given the structured facts object from incident-scribe, produce a short customer-facing
  status note describing what is affected, how severe it is in plain language, and what happens
  next. The note is generated through the parent's llm.call hand-off and is limited to 1500 output
  tokens for the initial subagent call.
edge_cases:
  - The note may contain either three or four sentences.
  - If a fact is absent from the input, it must not appear in the note.
  - The subagent has no tools and cannot independently resolve missing information.
validation_rules:
  - The output is three or four sentences.
  - The note describes the affected subject, severity in plain language, and next steps.
  - The note is based on the supplied facts object rather than a lookup.
assumptions:
  - The parent supplies a valid structured JSON facts object containing the stated fields.
  - The model provider behind llm.call is selected by the parent process.
sources:
  - 'incident_scribe/agent.py: COMMS_SYSTEM'
  - >-
    incident_scribe/agent.py: run_turn llm.call([llm.system(COMMS_SYSTEM), llm.user(facts_json)],
    max_output_tokens=1500)
  - 'README.md: The subagent'
known_data:
  - 3 sentences
  - 4 sentences
  - 1500 output tokens
calls: []
confidence: null
