local_id: F-003
name: Assign severity from the Northwind matrix
user_story: >-
  As an incident reporter, I submit a report containing a placeable symptom, so that execute returns
  an assessment with the matching Northwind S1, S2, or S3 severity row.
expected_behaviour: >-
  The desk assesses the incident using the Northwind S1/S2/S3 severity matrix and identifies the
  matching row in the completed assessment.
edge_cases:
  - >-
    Reports without a placeable symptom must use the NEEDS_INPUT path instead of receiving a
    severity.
  - The assessment must identify the matching matrix row.
validation_rules:
  - Severity must come from the Northwind S1/S2/S3 matrix.
  - A severity must not be assigned when no placeable symptom is present.
calls:
  - ops-directory
  - configured LLM provider
assumptions:
  - >-
    The report contains enough information for the model to select a row in the Northwind severity
    matrix.
sources:
  - incident_scribe/agent.py:run_turn
  - docs/incident-policy.pdf
  - README.md
known_data:
  - S1
  - S2
  - S3
confidence: null
