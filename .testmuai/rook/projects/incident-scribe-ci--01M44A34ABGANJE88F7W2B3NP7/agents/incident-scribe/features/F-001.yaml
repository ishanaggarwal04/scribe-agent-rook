local_id: F-001
name: Request missing incident details
user_story: >-
  As an incident reporter, I submit an incomplete incident report through execute, so that the desk
  tells me more information is needed rather than inventing an assessment.
expected_behaviour: >-
  For an incomplete incident report, the desk returns NEEDS_INPUT instead of assigning a severity,
  and does not produce customer-note or incident-record artifacts.
edge_cases:
  - Empty execute tasks are rejected.
  - Reports with no placeable symptom return NEEDS_INPUT.
  - No artifacts are produced for incomplete reports.
validation_rules:
  - >-
    The report must contain a symptom that can be placed in the severity matrix before severity is
    assigned.
calls:
  - configured LLM provider
  - .scribe-sessions
assumptions:
  - >-
    The request is submitted through an existing opened session using the execute command and a
    valid CLI token.
  - A placeable symptom is required to assign severity.
sources:
  - incident_scribe/agent.py:run_turn
  - incident_scribe/__main__.py:main
  - README.md
  - docs/incident-policy.pdf
known_data:
  - NEEDS_INPUT
confidence: null
