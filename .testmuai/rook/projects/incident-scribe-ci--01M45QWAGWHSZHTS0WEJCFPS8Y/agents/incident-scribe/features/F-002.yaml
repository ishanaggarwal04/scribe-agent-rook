local_id: F-002
name: Verify the affected service
user_story: >-
  As an incident reporter, I submit a message naming the affected service and its symptom, so that
  the desk verifies the service against the operations directory before attributing ownership or
  support details.
expected_behaviour: >-
  For a report naming a service, the desk uses lookup_service before stating the service owner,
  tier, or on-call address, and incorporates the returned service facts into the assessment. The
  lookup returns the service record or found:false.
edge_cases:
  - An unregistered service produces a lookup result with found:false.
  - The desk must not state owner, tier, or on-call attribution without a successful current lookup.
validation_rules:
  - Owner, tier, and on-call address may only be stated after lookup_service supplies them.
  - The lookup passes the service name.
calls:
  - ops-directory
  - configured LLM provider
assumptions:
  - The service named by the incident is registered in the operations directory.
  - The model selects the service lookup argument from the report.
sources:
  - incident_scribe/agent.py:run_turn
  - incident_scribe/agent.py:_ops_call
  - services/ops-directory.mjs:OPERATIONS.lookup_service
  - docs/incident-policy.pdf
confidence: null
known_data: []
