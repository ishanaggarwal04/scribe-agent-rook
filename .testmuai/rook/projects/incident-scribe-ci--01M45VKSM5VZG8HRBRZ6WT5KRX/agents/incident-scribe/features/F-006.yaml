local_id: F-006
name: Persist completed incident artifacts
user_story: >-
  As an incident operator, I submit a complete report in an existing session, so that execute
  returns machine-readable results and paths to the persisted customer-note and incident-record
  artifacts.
expected_behaviour: >-
  For a completed execute turn, the desk persists session state and transcript data and produces
  JSON customer-note and incident-record artifacts, returning artifact paths together with the
  response.
edge_cases:
  - Empty tasks, invalid session identifiers, missing sessions, and closed sessions are rejected.
  - Incomplete reports do not produce completion artifacts.
validation_rules:
  - A valid CLI token is required on every command.
  - The session must exist, be open, and have a valid identifier.
  - Empty execute tasks are rejected.
  - Incomplete reports return NEEDS_INPUT without artifacts.
calls:
  - .scribe-sessions
assumptions:
  - The execute request uses a valid existing session and reaches completion.
  - The session storage directory is writable.
sources:
  - incident_scribe/agent.py:run_turn
  - incident_scribe/__main__.py:Session
  - README.md
confidence: null
known_data: []
