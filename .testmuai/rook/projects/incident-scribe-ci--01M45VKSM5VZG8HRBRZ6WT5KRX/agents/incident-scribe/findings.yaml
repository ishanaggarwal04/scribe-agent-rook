- severity: high
  what: >-
    A previous session's service record and transcript are carried into later turns, but the code
    does not enforce a fresh lookup for each task.
  where: incident_scribe/agent.py:run_turn; state.json and conversation.json handling
  why: >-
    The policy requires owner, tier, and on-call attribution to be read from the directory during
    the current task; a later task can therefore reuse stale facts while appearing verified.
  id: FI-001
- severity: high
  what: >-
    Injection detection only records a log event and sends the raw report and retrieved incident
    text to the model without deterministic isolation or verification.
  where: incident_scribe/__main__.py:main; incident_scribe/agent.py:SCRIBE_SYSTEM and run_turn
  why: >-
    A report containing instruction-shaped text can still influence tool selection or the assessment
    if the model fails to follow the prompt-level data boundary.
  id: FI-002
- severity: medium
  what: >-
    The customer-note sanitizer does not enforce the full internal-information boundary described by
    the policy.
  where: incident_scribe/agent.py:_clean_note
  why: >-
    It removes known URLs, the known on-call address, hosts matching .internal, and severity codes,
    but it does not remove arbitrary internal hostnames such as status.northwind.example or enforce
    the subagent's no-team-name rule.
  id: FI-003
- severity: medium
  what: >-
    The desk trusts the model to choose the service named in the report and does not
    deterministically compare the lookup argument with the report text.
  where: incident_scribe/agent.py:run_turn
  why: >-
    A model can look up a different registered service and receive a completed assessment whose
    owner and tier are internally consistent but unrelated to the submitted incident.
  id: FI-004
