local_id: F-003
name: Restrict the note to established facts and qualified commitments
user_story: >-
  As incident-scribe, I provide only the facts already established in a structured JSON object, so
  that comms-writer produces a status note without inventing incident details or unsupported timing
  commitments.
expected_behaviour: >-
  Write only about facts present in the input facts object. Do not look up information, invent
  facts, or make unsupported claims. Do not promise timing that was not provided, and limit
  apologies to one clause.
edge_cases:
  - Facts that are missing, ambiguous, or not supplied must be omitted rather than filled in.
  - Timing promises must be omitted unless timing was explicitly provided.
  - An apology may occupy no more than one clause.
validation_rules:
  - Every substantive claim must be supported by an input fact.
  - No lookup or external-service call is used by comms-writer.
  - Timing promises require timing to be present in the input.
  - Apologies are limited to one clause.
assumptions:
  - The facts object is the authoritative boundary for what may be stated publicly.
sources:
  - 'incident_scribe/agent.py: COMMS_SYSTEM'
  - 'README.md: The subagent'
calls: []
confidence: null
known_data: []
