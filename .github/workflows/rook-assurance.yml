name: Rook assurance
# Runs the reviewed Rook suite against the agent: on pull requests into main that touch the
# agent or its suite, and on demand. Each run calls the real agent and its model provider,
# and spends Rook credits.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'incident_scribe/**'
      - 'services/**'
      - '.mcp.json'
      - 'package.json'
      - 'package-lock.json'
      - '.testmuai/rook/**'
      - 'ci/**'
      - '.github/workflows/rook-assurance.yml'
permissions:
  contents: read
concurrency:
  # One run per PR (or per branch for manual runs). Never cancel a run in progress: it
  # has already spent credits and its evidence is worth keeping.
  group: rook-assurance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  assurance:
    # The PR's own code runs with these secrets: the agent and the profile's hook scripts.
    # So only PRs from branches in this repository run. Fork PRs get no secrets from
    # `pull_request` anyway, and `pull_request_target` must never be used here
    # (TestMu AI: "Do not run untrusted pull-request hook scripts with repository secrets.").
    # Manual runs stay limited to main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    # One scenario at a time, and a single execute can take up to ~50 s on the configured model.
    timeout-minutes: 60
    environment: rook-assurance
    env:
      # Which Rook servers the public CLI talks to: prod unless the ROOK_ENV variable says stage.
      # Stage only accepts the LambdaTest VPN, so GitHub-hosted runners get a Cloudflare 403
      # there; set ROOK_ENV=stage only once CI has stage access or runs on a VPN runner.
      ROOK_ENV: ${{ vars.ROOK_ENV || 'prod' }}
      ROOK_PROJECT_ID: ${{ vars.ROOK_PROJECT_ID }}
      ROOK_AGENT_ID: ${{ vars.ROOK_AGENT_ID }}
      ROOK_PROFILE: ${{ vars.ROOK_PROFILE }}
      ROOK_SCENARIO_IDS: ${{ vars.ROOK_SCENARIO_IDS }}
      ROOK_ALLOW_RULES: ${{ vars.ROOK_ALLOW_RULES }}
      ROOK_CONCURRENCY: ${{ vars.ROOK_CONCURRENCY }}
      # Dashboard label: github-pr12-<run>-<attempt> for a PR, github-<run>-<attempt> otherwise.
      ROOK_RUN_NAME: github-${{ github.event.pull_request.number && format('pr{0}-', github.event.pull_request.number) || '' }}${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # incident-scribe is a Python CLI that spawns its Node ops-directory MCP server.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      # The public CLI; ROOK_ENV above points it at stage or prod.
      - name: Install pinned public Rook CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/LambdaTest/rook/main/install.sh \
            -o "$RUNNER_TEMP/install-rook.sh"
          bash "$RUNNER_TEMP/install-rook.sh" --version 0.1.5 --dir "$RUNNER_TEMP/rook-bin"
          echo "$RUNNER_TEMP/rook-bin" >> "$GITHUB_PATH"
          # Rook's home (credentials, env store) stays outside the checkout. The runner
          # context is not available in job-level env, so it is set here.
          echo "ROOK_HOME=$RUNNER_TEMP/rook-home" >> "$GITHUB_ENV"
          command -v jq
      - name: Run the reviewed suite
        shell: bash
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          # The profile's declared variable.
          SCRIBE_API_TOKEN: ${{ secrets.SCRIBE_API_TOKEN }}
          # The agent's own model configuration (its .env locally).
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: bash ci/rook-ci.sh
      - name: Preserve results even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rook-${{ github.run_id }}-${{ github.run_attempt }}
          path: rook-results/
          if-no-files-found: warn
          retention-days: 7
